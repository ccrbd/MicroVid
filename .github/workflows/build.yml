name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            artifact: MicroVid-windows
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            triple: aarch64-apple-darwin
            artifact: MicroVid-macos-arm64
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch FFmpeg sidecars
        shell: bash
        run: ./scripts/fetch-ffmpeg.sh ${{ matrix.triple }}
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('MicroVid {0}', github.ref_name) || '' }}
          releaseDraft: false
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path "*/bundle/*" \( -name "*-setup.exe" -o -name "*.dmg" \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
