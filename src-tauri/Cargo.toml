[package]
name = "microvid"
version = "0.1.0"
description = "Tiny, high-quality video re-encodes for your media server"
authors = ["MicroVid contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ccrbd/MicroVid"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "microvid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
anyhow = "1.0.104"
thiserror = "2.0.20"
walkdir = "2.5.0"
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.0", features = ["v4"] }
sysinfo = "0.39.6"
reqwest = { version = "0.13.4", features = ["json", "query"] }
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_Foundation"] }
